name: master-build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web assets
        run: bash scripts/build-web.sh
      - name: Build solution
        run: dotnet build ServerNodeMonitor.slnx -c Release
      - name: Test
        run: dotnet test ServerNodeMonitor.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - name: Agent ILC gate (analyzers already enforce zero warnings; this compiles for real)
        run: bash scripts/ilc-check.sh linux-x64
      - name: Vulnerable packages (informational)
        run: dotnet list ServerNodeMonitor.slnx package --vulnerable --include-transitive || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        rid: [ linux-x64, linux-arm64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-web.sh
      - name: Publish master
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet publish src/SNM.Master/SNM.Master.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$VERSION -o out/${{ matrix.rid }}
          cp LICENSE out/${{ matrix.rid }}/ 2>/dev/null || true
          cp src/SNM.Contracts/THIRD-PARTY-NOTICES.md out/${{ matrix.rid }}/
          tar czf snm-master-${{ matrix.rid }}.tar.gz -C out/${{ matrix.rid }} .
          sha256sum snm-master-${{ matrix.rid }}.tar.gz > snm-master-${{ matrix.rid }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: snm-master-${{ matrix.rid }}
          path: snm-master-${{ matrix.rid }}.tar.gz*

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/snm-master:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/snm-master:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ publish, docker ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: snm-master-*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
