# Nginx reverse proxy for Server Node Monitor (TLS terminated here; the master listens on 127.0.0.1:5080).
# WebSockets are required on /hubs/ for agents and browsers.

upstream snm_master {
    server 127.0.0.1:5080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name m.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.example.com;

    ssl_certificate     /etc/letsencrypt/live/m.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    access_log /var/log/nginx/snm.access.log;

    # SignalR hubs: WebSocket upgrade + long timeouts (LongPolling fallback needs >= 100 s)
    location /hubs/ {
        proxy_pass http://snm_master;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # REST API, install scripts, health
    location ~ ^/(api|install|healthz) {
        proxy_pass http://snm_master;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }

    # Static UI (public dashboard at /, admin SPA at /admin/)
    location / {
        proxy_pass http://snm_master;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
